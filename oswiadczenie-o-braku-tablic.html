<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTOGOOD Oświadczenie o braku tablic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/pdf.css?v=20260820-history-icons-1" />
    <link rel="stylesheet" href="./src/no-plates-declaration.css?v=20260820-history-icons-1" />
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  </head>
  <body>
    <main class="app-shell declarationWorkspace">
      <header class="topbar">
        <div class="brand">
          <a href="./umowy.html" aria-label="AUTOGOOD Umowy">
            <img src="./assets/autogood-logo.png" alt="AUTOGOOD" />
          </a>
          <span class="brandDivider" aria-hidden="true"></span>
          <span class="brandTitle">Oświadczenie<span class="badge-pill">Brak tablic</span></span>
        </div>
        <div class="actions">
          <button id="resetDeclaration" class="ghost-btn action-icon-btn" type="button"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v6h6"/><path d="M21 12A9 9 0 0 0 6 5.3L3 8"/><path d="M21 22v-6h-6"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/></svg><span>Wyzeruj dane</span></button>
          <button id="saveDeclarationData" class="secondary-top-btn action-icon-btn" type="button"><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg><span>Zapisz</span></button>
          <button id="printDeclaration" class="secondary-top-btn" type="button">Drukuj</button>
          <button id="downloadDeclarationPdf" class="primary-btn" type="button">Pobierz PDF</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="utility-column">
          <section class="paste-panel declaration-choice-panel">
            <div class="section-title">Wybór</div>
            <div class="input-card">
              <fieldset class="declaration-choice" aria-label="Sposób zakupu">
                <legend>Zakup</legend>
                <label><input name="purchaseMode" type="radio" value="autogood" checked /><span>Przez AUTOGOOD</span></label>
                <label><input name="purchaseMode" type="radio" value="direct" /><span>Bezpośredni</span></label>
              </fieldset>

              <fieldset id="clientGenderChoice" class="declaration-choice" hidden aria-label="Rodzaj oświadczenia klienta">
                <legend>Oświadczenie klienta</legend>
                <label><input name="clientGender" type="radio" value="man" checked /><span>Pan</span></label>
                <label><input name="clientGender" type="radio" value="woman" /><span>Pani</span></label>
              </fieldset>
              <p id="declarationHint" class="declaration-hint">Wypełnij dane do oświadczenia AUTOGOOD.</p>
              <div id="declarationStatus" class="status" aria-live="polite"></div>
            </div>
          </section>

          <section class="contract-history history-strip">
            <div class="history-title">Historia zapisów</div>
            <div id="declarationHistoryList" class="history-list"></div>
          </section>
        </aside>

        <section class="form-section">
          <form id="declarationForm" class="declaration-form">
            <section class="contract-grid declaration-grid">
              <section class="contract-card">
                <div class="card-head">DANE OŚWIADCZENIA:</div>
                <div id="autogoodFields">
                  <label class="field">
                    <span>Data oświadczenia:</span>
                    <input name="autogoodDate" type="date" />
                  </label>
                  <label class="field">
                    <span>Marka i model:</span>
                    <input name="vehicleMakeModel" type="text" autocomplete="off" />
                  </label>
                  <label class="field">
                    <span>VIN:</span>
                    <input name="vehicleVin" type="text" autocomplete="off" />
                  </label>
                </div>

                <div id="directFields" hidden>
                  <div class="two-fields">
                    <label class="field">
                      <span>Miejscowość:</span>
                      <input name="city" type="text" autocomplete="address-level2" />
                    </label>
                    <label class="field">
                      <span>Data oświadczenia:</span>
                      <input name="documentDate" type="date" />
                    </label>
                  </div>
                  <label class="field">
                    <span class="font-field-label">
                      <span>Imię i nazwisko:</span>
                      <span class="pdf-font-controls" aria-label="Rozmiar tekstu imienia i nazwiska w PDF">
                        <button type="button" data-font-size-field="clientName" data-font-size-step="-0.5" title="Zmniejsz tekst o 0,5 pt" aria-label="Zmniejsz tekst imienia i nazwiska o 0,5 pt">−</button>
                        <button type="button" data-font-size-field="clientName" data-font-size-step="0.5" title="Powiększ tekst o 0,5 pt" aria-label="Powiększ tekst imienia i nazwiska o 0,5 pt">+</button>
                      </span>
                    </span>
                    <input name="clientName" type="text" autocomplete="name" aria-label="Imię i nazwisko" />
                  </label>
                  <div class="two-fields">
                    <label class="field">
                      <span>Dokument tożsamości:</span>
                      <select name="identityDocument" autocomplete="off">
                        <option value="">Wybierz dokument</option>
                        <option value="kartą pobytu">kartą pobytu</option>
                        <option value="paszportem">paszportem</option>
                        <option value="dowodem osobistym">dowodem osobistym</option>
                      </select>
                    </label>
                    <label class="field">
                      <span>Numer dokumentu:</span>
                      <input name="identityNumber" type="text" autocomplete="off" />
                    </label>
                  </div>
                  <label class="field">
                    <span class="font-field-label">
                      <span>Marka i model:</span>
                      <span class="pdf-font-controls" aria-label="Rozmiar tekstu marki i modelu w PDF">
                        <button type="button" data-font-size-field="vehicleMakeModel" data-font-size-step="-0.5" title="Zmniejsz tekst o 0,5 pt" aria-label="Zmniejsz tekst marki i modelu o 0,5 pt">−</button>
                        <button type="button" data-font-size-field="vehicleMakeModel" data-font-size-step="0.5" title="Powiększ tekst o 0,5 pt" aria-label="Powiększ tekst marki i modelu o 0,5 pt">+</button>
                      </span>
                    </span>
                    <input name="vehicleMakeModel" type="text" autocomplete="off" aria-label="Marka i model" />
                  </label>
                  <label class="field">
                    <span>VIN:</span>
                    <input name="vehicleVin" type="text" autocomplete="off" />
                  </label>
                  <label class="field">
                    <span>Data sprowadzenia pojazdu:</span>
                    <input name="importDate" type="date" />
                  </label>
                </div>

              </section>

              <section class="contract-card declaration-pdf-preview" aria-label="Podgląd oświadczenia">
                <div class="declaration-pdf-preview-head">Podgląd oświadczenia</div>
                <iframe id="declarationPreview" title="Podgląd oświadczenia o braku tablic"></iframe>
              </section>
            </section>
          </form>
        </section>
      </section>
    </main>
    <script src="./src/no-plates-declaration.js?v=20260820-history-1"></script>
  </body>
</html>
