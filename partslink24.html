<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTOGOOD VIN спецификация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./tokens.css?v=vincheck-20260724-1" />
    <link rel="stylesheet" href="./src/tools.css?v=vincheck-20260724-1" />
    <style>
      /* Hallmark · macrostructure: Workbench · tone: utilitarian · anchor hue: AUTOGOOD blue · nav: N9 · footer: Ft2 · contrast: pass (40–41) · mobile: pass (34, 49, 50–57) */
      html,
      body {
        overflow-x: clip;
      }

      body.partslinkPage {
        min-width: 320px;
        background: var(--ag-color-paper);
        color: var(--ag-color-ink);
        font-family: var(--ag-font-body);
        font-variant-numeric: tabular-nums;
      }

      .partslinkPage :focus {
        outline: none;
      }

      .partslinkPage :focus-visible {
        outline: 2px solid var(--ag-color-focus);
        outline-offset: 2px;
      }

      .partslinkShell {
        display: flex;
        flex-direction: column;
        width: min(1200px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: var(--ag-space-2xl) 0 var(--ag-space-page-bottom);
      }

      .partslinkTopbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-lg);
        padding-bottom: var(--ag-space-md);
        border-bottom: var(--ag-rule-card);
      }

      .partslinkWordmark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        color: var(--ag-color-ink);
        text-decoration: none;
      }

      .partslinkWordmark img {
        width: 164px;
        max-width: var(--ag-logo-max-width);
        height: auto;
        display: block;
      }

      .partslinkWordmarkDivider {
        flex: 0 0 auto;
        width: 1px;
        height: 26px;
        background: var(--ag-color-rule-2);
      }

      .partslinkWordmark span:not(.partslinkWordmarkDivider) {
        color: var(--ag-color-accent-dark);
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .partslinkHeaderActions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--ag-space-md);
        min-width: 0;
      }

      .partslinkUiLanguageSwitch {
        display: inline-flex;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
      }

      .partslinkUiLanguageSwitch button {
        min-width: 42px;
        border: 0;
        background: var(--ag-color-surface);
        color: var(--ag-color-muted);
        padding: 7px 12px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkUiLanguageSwitch button + button {
        border-left: 1px solid var(--ag-color-rule-2);
      }

      .partslinkUiLanguageSwitch button[aria-pressed="true"] {
        background: var(--ag-color-accent-dark);
        color: var(--ag-color-accent-ink);
      }

      .partslinkHero {
        display: grid;
        grid-template-columns: minmax(0, 0.86fr) minmax(var(--ag-hero-copy-min-width), 0.5fr);
        gap: var(--ag-space-xl);
        align-items: end;
        padding: var(--ag-space-2xl) 0 var(--ag-space-lg);
      }

      .partslinkEyebrow,
      .partslinkPanelTitle {
        margin: 0;
        color: var(--ag-color-muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .partslinkHero h1 {
        max-width: 22ch;
        min-width: 0;
        margin: var(--ag-space-xs) 0 0;
        color: var(--ag-color-ink);
        font-family: var(--ag-font-display);
        font-size: var(--ag-text-display);
        font-style: normal;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .partslinkWorkbench {
        display: grid;
        grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
        gap: var(--ag-space-lg);
        align-items: stretch;
      }

      .partslinkCard,
      .partslinkResultCard {
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkCard {
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        gap: var(--ag-space-sm);
      }

      .partslinkField {
        display: grid;
        gap: var(--ag-space-label-gap);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        font-weight: 600;
        line-height: 1.3;
      }

      .partslinkField span {
        display: block;
      }

      .partslinkField input,
      .partslinkField select {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 600;
        letter-spacing: 0;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out);
      }

      .partslinkField input:hover,
      .partslinkField select:hover {
        background: var(--ag-color-surface-tint);
      }

      .partslinkBrandNativeSelect {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .partslinkBrandPicker {
        position: relative;
      }

      .partslinkBrandPickerButton {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
      }

      .partslinkBrandPickerButton:hover,
      .partslinkBrandPickerButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
      }

      .partslinkBrandPickerButton[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandCaret {
        flex: 0 0 auto;
        margin-left: var(--ag-space-sm);
        color: var(--ag-color-muted);
        font-size: 12px;
      }

      .partslinkBrandOptions {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        display: grid;
        max-height: 340px;
        overflow-y: auto;
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        box-shadow: 0 12px 28px rgb(21 48 74 / 16%);
      }

      .partslinkBrandOptions[hidden] {
        display: none;
      }

      .partslinkBrandOption {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ag-color-rule);
        background: transparent;
        color: var(--ag-color-ink);
        padding: 10px var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
      }

      .partslinkBrandOption:last-child {
        border-bottom: 0;
      }

      .partslinkBrandOption--group-end {
        border-bottom: 1px solid var(--ag-color-rule-2);
      }

      .partslinkBrandOption[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandOption:hover,
      .partslinkBrandOption:focus-visible {
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-accent-dark);
      }

      .partslinkBrandOption[aria-selected="true"] {
        background: oklch(93% 0.025 240);
        color: var(--ag-color-accent-dark);
        box-shadow: inset 3px 0 0 var(--ag-color-accent);
        font-weight: 600;
      }

      .partslinkBrandOption:focus-visible {
        outline: 1px solid var(--ag-color-rule-2);
        outline-offset: -1px;
      }

      .partslinkField input:focus-visible,
      .partslinkField select:focus-visible {
        border-color: var(--ag-color-accent);
      }

      .partslinkHint {
        min-height: 1lh;
        color: var(--ag-color-muted);
        font-size: var(--ag-text-xs);
        font-weight: 400;
        line-height: 1.35;
      }

      .partslinkActions {
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        gap: var(--ag-space-xs);
        flex-wrap: wrap;
        padding-top: var(--ag-space-md);
        order: 2;
      }

      .partslinkShell button:not(.partslinkBrandOption),
      .partslinkDownloadLink {
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out), color var(--ag-dur-short) var(--ag-ease-out), box-shadow var(--ag-dur-short) var(--ag-ease-out), transform 100ms var(--ag-ease-out);
      }

      .partslinkShell button:not(.partslinkBrandOption):hover:not(:disabled),
      .partslinkShell button:not(.partslinkBrandOption):focus-visible:not(:disabled),
      .partslinkDownloadLink:hover,
      .partslinkDownloadLink:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgb(12 72 111 / 14%);
      }

      .partslinkShell button:not(.partslinkBrandOption):active:not(:disabled),
      .partslinkDownloadLink:active {
        transform: translateY(1px);
        box-shadow: none;
      }

      .partslinkActions button:not(.partslinkIconButton),
      .partslinkDownloadLink {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--ag-size-download-action);
        border: 1px solid var(--ag-color-accent);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: var(--ag-space-control-y) var(--ag-space-button-x);
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out), transform 100ms var(--ag-ease-out);
      }

      .partslinkActions button:hover,
      .partslinkDownloadLink:hover {
        transform: translateY(-1px);
      }

      .partslinkActions button:active,
      .partslinkDownloadLink:active {
        transform: translateY(1px);
      }

      .partslinkActions button:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-rule);
        color: var(--ag-color-muted);
        cursor: wait;
        transform: none;
      }

      .partslinkDownloadLink[hidden] {
        display: none;
      }

      .partslinkDownloadLink.partslinkIconButton {
        width: 32px;
        min-width: 32px;
        height: 32px;
        min-height: 32px;
        flex: 0 0 auto;
        border-color: var(--ag-color-accent);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: 0;
      }

      .partslinkDownloadLink.partslinkIconButton:hover,
      .partslinkDownloadLink.partslinkIconButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
      }

      .partslinkDownloadLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .partslinkFileActions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }

      .partslinkHistoryDelete {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--ag-size-download-action);
        border: 1px solid var(--ag-color-accent);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: var(--ag-space-control-y) var(--ag-space-button-x);
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }

      .partslinkIconButton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        min-width: 32px;
        height: 32px;
        min-height: 32px;
        padding: 0;
        box-sizing: border-box;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkIconButton:hover:not(:disabled),
      .partslinkIconButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-accent-dark);
        outline: 0;
      }

      .partslinkIconButton:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-muted);
        cursor: not-allowed;
      }

      .partslinkActions .partslinkIconButton {
        padding: 0;
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
      }

      .partslinkActions .partslinkIconButton:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-muted);
      }

      .partslinkActionIcon {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .partslinkSearchIcon {
        width: 14px;
        height: 14px;
        stroke-width: 1.8;
      }

      .partslinkSaveIcon {
        width: 16px;
        height: 16px;
      }

      .partslinkHistory {
        display: grid;
        gap: var(--ag-space-md);
        margin-top: var(--ag-space-lg);
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkHistoryList {
        display: grid;
        gap: var(--ag-space-sm);
        overflow-x: auto;
      }

      .partslinkHistoryHeader,
      .partslinkHistoryRow {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr)) 42px;
        gap: 18px;
        align-items: center;
        min-width: 1120px;
        text-align: center;
      }

      .partslinkHistoryHeader {
        padding: 0 var(--ag-space-sm);
        color: var(--ag-color-muted);
        font-size: var(--ag-text-xs);
        font-weight: 700;
        line-height: 1.3;
      }

      .partslinkHistoryRow {
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        padding: var(--ag-space-sm);
      }

      .partslinkHistoryValue {
        color: var(--ag-color-ink);
        font-size: var(--ag-text-sm);
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .partslinkHistorySavedAt {
        display: grid;
        gap: 2px;
        color: var(--ag-color-muted);
        font-weight: 600;
        line-height: 1.25;
      }

      .partslinkHistorySavedTime {
        font-size: var(--ag-text-xs);
        font-weight: 500;
      }

      .partslinkHistoryDelete {
        min-width: 42px;
        padding-inline: 12px;
        background: transparent;
        color: var(--ag-color-error);
        border-color: var(--ag-color-rule-2);
        font-size: 18px;
      }

      .partslinkResultCard {
        display: grid;
        align-content: start;
        gap: var(--ag-space-md);
      }

      .partslinkResultHead {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: var(--ag-space-sm);
      }

      .partslinkCopyResult {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border: 1px solid var(--ag-color-rule-2);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-surface);
        color: var(--ag-color-accent-dark);
        padding: 0;
        font-family: var(--ag-font-body);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .partslinkCopyResultIcon {
        font-size: 17px;
        font-weight: 400;
      }

      .partslinkCopyResult:hover:not(:disabled),
      .partslinkCopyResult:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
      }

      .partslinkCopyResult:disabled {
        color: var(--ag-color-muted);
        background: var(--ag-color-surface-tint);
        cursor: not-allowed;
        opacity: 1;
      }

      .partslinkSpecRows {
        display: grid;
        gap: 0;
      }

      .partslinkSpecRow {
        display: grid;
        grid-template-columns: minmax(0, 0.68fr) minmax(var(--ag-result-min-width), 1fr);
        gap: var(--ag-space-md);
        align-items: center;
        min-height: calc(var(--ag-size-action) + var(--ag-space-sm));
        border-bottom: 2px solid var(--ag-color-rule);
        padding: var(--ag-space-sm) 0;
      }

      .partslinkSpecRow:first-child {
        border-bottom-color: var(--ag-color-soft);
      }

      .partslinkSpecRow:last-child {
        border-bottom: 0;
      }

      .partslinkSpecRow span {
        color: var(--ag-color-ink);
        font-size: var(--ag-text-base);
        font-weight: 600;
      }

      .partslinkSpecRow strong,
      .partslinkReadonlyField {
        color: var(--ag-color-accent-dark);
        font-size: var(--ag-text-md);
        font-weight: 800;
        line-height: 1.2;
      }

      .partslinkReadonlyField {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font-family: var(--ag-font-body);
      }

      .partslinkReadonlyField::placeholder {
        color: var(--ag-color-muted);
      }

      .partslinkFileBlock {
        display: grid;
        gap: var(--ag-space-md);
        margin-top: var(--ag-space-lg);
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkFileHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-md);
        flex-wrap: wrap;
      }

      .partslinkFileViewer {
        display: grid;
        gap: var(--ag-space-md);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        overflow: hidden;
      }

      .partslinkFileViewer[data-empty="true"] {
        place-items: center;
        min-height: 220px;
      }

      .partslinkFileEmpty {
        margin: 0;
        padding: var(--ag-space-lg);
        color: var(--ag-color-muted);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
        text-align: center;
      }

      .partslinkFilePane {
        display: grid;
        gap: 0;
        min-width: 0;
      }

      .partslinkFileCaption {
        margin: 0;
        border-bottom: var(--ag-rule-field);
        background: var(--ag-color-surface);
        padding: var(--ag-space-sm) var(--ag-space-field-x);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-xs);
        font-weight: 700;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .partslinkFileFrame {
        display: block;
        width: 100%;
        height: min(78vh, 900px);
        min-height: 520px;
        border: 0;
        background: var(--ag-color-surface);
      }

      .partslinkFileText {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: min(78vh, 900px);
        min-height: 520px;
        border: 0;
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-field-x);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        line-height: 1.45;
        resize: vertical;
        white-space: pre;
      }

      .partslinkStatus {
        align-self: start;
        order: 1;
        min-height: 20px;
        margin: 0;
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
      }

      .partslinkStatus[data-tone="success"] {
        color: var(--ag-color-success);
        font-weight: 700;
      }

      .partslinkStatus[data-tone="error"] {
        color: var(--ag-color-error);
        font-weight: 700;
      }

      @media (max-width: 780px) {
        .partslinkShell {
          width: min(100% - 32px, 1200px);
          padding-top: var(--ag-space-xl);
        }

        .partslinkTopbar,
        .partslinkHero,
        .partslinkWorkbench {
          grid-template-columns: 1fr;

        const params = new URLSearchParams(window.location.search);

        if (/^https:\/\/[a-z0-9.-]+/i.test(normalized)) {

        let reason = reasons.generic;

        else if (/логотип.*марки|brand.*(?:logo|not found)|марка.*(?:не найдена|not found)/i.test(source)) reason = reasons.brandNotFound;
        else if (/login|logowanie|вход|username|password|парол/i.test(source)) reason = reasons.login;
        else if (/не вернул.*pdf|nie zwrócił.*pdf|did not.*pdf|pdf.*(?:not|не).*(?:returned|получен)/i.test(source)) reason = reasons.pdf;

        const header = document.createElement("div");
        header.className = "partslinkHistoryHeader";
        ["historyBrandModel", "historyVin", "historyProductionDate", "historyEngineType", "historyEngineVolume", "historySavedAt"].forEach((key) => {
          const label = document.createElement("span");
          label.textContent = uiText(key);
          header.append(label);
        });
        header.append(document.createElement("span"));
        historyList.append(header);
        if (!vinHistory.length) {
          historyList.append(makeFileMessage(uiText("emptyHistory")));
          return;
        }

        vinHistory.forEach((item) => {
          const row = document.createElement("div");
          row.className = "partslinkHistoryRow";
          [item.vehicleDescription, item.vin, item.productionDate, localizeEngineType(item.engineType), item.engineVolume].forEach((value) => {
            const field = document.createElement("span");
            field.className = "partslinkHistoryValue";
            field.textContent = value || "—";
            row.append(field);
          });
          row.append(makeSavedAtCell(item.savedAt));

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.className = "partslinkHistoryDelete";
          removeButton.textContent = "×";
          removeButton.title = uiText("deleteHistory");
          removeButton.setAttribute("aria-label", `${uiText("deleteHistory")}: ${item.vin}`);
          removeButton.addEventListener("click", () => {
            vinHistory = vinHistory.filter((entry) => entry.id !== item.id);
            writeVinHistory();
            renderVinHistory();
          });
          row.append(removeButton);
          historyList.append(row);
        });
      }

      function saveCurrentVin() {
        const vin = vinInput.value.trim().toUpperCase();
        const vehicleDescription = vehicleDescriptionInput.value.trim();
        if (!vin || !vehicleDescription) return;

        const item = {
          id: `${vin}-${Date.now()}`,
          vehicleDescription,
          vin,
          productionDate: productionDateInput.dataset.rawValue || "",
          engineType: engineTypeInput.dataset.rawValue || "",
          engineVolume: engineVolumeInput.dataset.rawValue || "",
          savedAt: new Date().toISOString()
        };
        vinHistory = [item, ...vinHistory.filter((entry) => entry.vin !== vin)].slice(0, 100);
        writeVinHistory();
        renderVinHistory();
        setSaveButtonIcon(true);
        window.setTimeout(() => {
          setSaveButtonIcon(false);
        }, 1400);
      }

      function makeSavedAtCell(value) {
        const field = document.createElement("span");
        field.className = "partslinkHistoryValue partslinkHistorySavedAt";
        const date = new Date(value || "");
        if (Number.isNaN(date.getTime())) {
          field.textContent = "—";
          return field;
        }

        const locale = uiLanguage === "pl" ? "pl-PL" : "ru-RU";
        const dateLine = document.createElement("span");
        dateLine.textContent = new Intl.DateTimeFormat(locale, {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }).format(date);
        const timeLine = document.createElement("span");
        timeLine.className = "partslinkHistorySavedTime";
        timeLine.textContent = new Intl.DateTimeFormat(locale, {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        }).format(date);
        field.append(dateLine, timeLine);
        return field;
      }

      function localizeEngineType(value) {
        if (uiLanguage !== "pl") return value;
        return value
          .replace(/PHEV \(подключаемый гибрид\)/gi, "PHEV (Hybryda Plug-in)")
          .replace(/MHEV \(мягкий гибрид\)/gi, "MHEV (Miękka hybryda)")
          .replace(/HEV \(обычный гибрид\)/gi, "HEV (Hybryda)")
          .replace(/Электрический/gi, "Elektryczny")
          .replace(/Бензин/gi, "Benzyna")
          .replace(/Дизель/gi, "Diesel");
      }

      function renderLocalizedResultValues() {
        const productionDate = productionDateInput.dataset.rawValue || "";
        const engineType = engineTypeInput.dataset.rawValue || "";
        const engineVolume = engineVolumeInput.dataset.rawValue || "";
        productionDateInput.value = uiLanguage === "pl"
          ? productionDate.replace(/\(дата поставки\)/gi, "(data dostawy)")
          : productionDate;
        engineTypeInput.value = localizeEngineType(engineType);
        engineVolumeInput.value = engineVolume;
      }

      function updateCopyButtonLabel() {
        const key = copyResultButton.dataset.copied === "true" ? "copied" : "copyTitle";
        copyResultButton.title = uiText(key);
        copyResultButton.setAttribute("aria-label", copyResultButton.title);
      }

      function updateActionButtonLabels() {
        checkButton.title = uiText("checkTitle");
        checkButton.setAttribute("aria-label", checkButton.title);
        const saveKey = saveButton.dataset.saved === "true" ? "savedTitle" : "saveTitle";
        saveButton.title = uiText(saveKey);
        saveButton.setAttribute("aria-label", saveButton.title);
      }

      function setSaveButtonIcon(saved) {
        saveButton.dataset.saved = String(saved);
        saveButtonIcon.innerHTML = saved
          ? '<path d="M20 6 9 17l-5-5"></path>'
          : '<path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path>';
        updateActionButtonLabels();
      }

      function applyUiLanguage(language, { persist = true } = {}) {
        uiLanguage = language === "pl" ? "pl" : "ru";
        document.documentElement.lang = uiLanguage;
        document.title = uiText("pageTitle");
        document.querySelectorAll("[data-ui-key]").forEach((element) => {
          element.textContent = uiText(element.dataset.uiKey);
        });
        uiLanguageButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.uiLanguage === uiLanguage));
        });
        uiLanguageSwitch.setAttribute("aria-label", uiText("uiLanguageAria"));
        document.querySelector(".partslinkResultCard")?.setAttribute("aria-label", uiText("resultAria"));
        document.querySelector(".partslinkFileBlock")?.setAttribute("aria-label", uiText("fileAria"));
        updateCopyButtonLabel();
        updateActionButtonLabels();
        renderLocalizedResultValues();
        renderVinHistory();
        if (fileViewer.dataset.empty === "true") {
          fileViewer.replaceChildren(makeFileMessage(uiText("emptyFile")));
        }
        const messageKey = statusLine.dataset.messageKey;
        if (messageKey) statusLine.textContent = uiText(messageKey);
        if (persist) {
          try {
            localStorage.setItem("partslink24-ui-language", uiLanguage);
          } catch {}
        }
      }

      function releasePreviewUrls() {
        previewObjectUrls.forEach((url) => URL.revokeObjectURL(url));
        previewObjectUrls = [];
      }

      function makeFileMessage(text) {
        const message = document.createElement("p");
        message.className = "partslinkFileEmpty";
        message.textContent = text;
        return message;
      }

      function resetDownloadLink() {
        releasePreviewUrls();
        downloadLinks.hidden = true;
        downloadLinks.replaceChildren();
        fileViewer.dataset.empty = "true";
        fileViewer.replaceChildren(makeFileMessage(uiText("emptyFile")));
      }

      function resetProductionDate() {
        productionDateInput.dataset.rawValue = "";
        engineTypeInput.dataset.rawValue = "";
        engineVolumeInput.dataset.rawValue = "";
        productionDateInput.value = "";
        engineTypeInput.value = "";
        engineVolumeInput.value = "";
      }

      function setVehicleDescription(value) {
        vehicleDescriptionInput.value = value || "";
      }

      function resetResults() {
        resetDownloadLink();
        resetProductionDate();
        setVehicleDescription("");
        copyResultButton.disabled = true;
        saveButton.disabled = true;
        setSaveButtonIcon(false);
        copyResultButton.dataset.copied = "false";
        copyResultButton.querySelector("span").innerHTML = "&#10697;";
        updateCopyButtonLabel();
        statusLine.textContent = "";
        delete statusLine.dataset.messageKey;
        statusLine.removeAttribute("data-tone");
      }

      async function writeClipboardText(value) {
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(value);
            return;
          }
        } catch {}

        const helper = document.createElement("textarea");
        helper.value = value;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.append(helper);
        helper.select();
        const copied = document.execCommand("copy");
        helper.remove();
        if (!copied) throw new Error(uiText("copyError"));
      }

      copyResultButton.addEventListener("click", async () => {
        const vin = vinInput.value.trim();
        const productionDate = productionDateInput.value.trim();
        if (!vin || !productionDate) return;

        try {
          const isMercedes = brandSelect.value.startsWith("Mercedes");
          const dateLabel = uiText(isMercedes ? "clipboardDeliveryDate" : "clipboardProductionDate");
          const copiedDate = isMercedes
            ? productionDate.replace(/\s*\((?:дата поставки|data dostawy)\)\s*$/i, "")
            : productionDate;
          await writeClipboardText(`VIN: ${vin}\n${dateLabel}: ${copiedDate}`);
          copyResultButton.querySelector("span").textContent = "✓";
          copyResultButton.dataset.copied = "true";
          updateCopyButtonLabel();
          window.setTimeout(() => {
            copyResultButton.querySelector("span").innerHTML = "&#10697;";
            copyResultButton.dataset.copied = "false";
            updateCopyButtonLabel();
          }, 1400);
        } catch (error) {
          setStatus(error.message || uiText("copyError"), "error");
        }
      });

      saveButton.addEventListener("click", saveCurrentVin);

      function setStatus(message, tone = "", messageKey = "") {
        statusLine.textContent = message;
        if (messageKey) statusLine.dataset.messageKey = messageKey;
        else delete statusLine.dataset.messageKey;
        if (tone) {
          statusLine.dataset.tone = tone;
        } else {
          statusLine.removeAttribute("data-tone");
        }
      }

      function setStatusFromKey(key, tone = "") {
        setStatus(uiText(key), tone, key);
      }

      function setBusy(isBusy) {
        checkButton.disabled = isBusy;
      }

      async function renderDownloadLinks(files, apiBase, brand, vin) {
        releasePreviewUrls();
        downloadLinks.replaceChildren();
        fileViewer.replaceChildren();

        const usableFiles = files.filter((file) => file.downloadUrl);
        if (!usableFiles.length) {
          downloadLinks.hidden = true;
          fileViewer.dataset.empty = "true";
          fileViewer.append(makeFileMessage(uiText("noFile")));
          return;
        }

        fileViewer.dataset.empty = "false";

        for (const [index, file] of usableFiles.entries()) {
          const fileName = makePdfFileName(brand, vin);
          const separator = file.downloadUrl.includes("?") ? "&" : "?";
          const directUrl = `${apiBase}${file.downloadUrl}${separator}downloadName=${encodeURIComponent(fileName)}`;

          const link = document.createElement("a");
          const downloadLabel = usableFiles.length > 1 ? uiText("downloadFileNumber", index + 1) : uiText("downloadFile");
          link.className = "partslinkDownloadLink partslinkIconButton";
          // Always download from the server URL. The server enforces the final
          // filename, while the blob URL is used only for the embedded preview.
          link.href = directUrl;
          link.download = fileName;
          link.setAttribute("aria-label", downloadLabel);
          link.title = downloadLabel;
          link.innerHTML = `
            <svg class="partslinkActionIcon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 3v12"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
          `;
          downloadLinks.append(link);

          const pane = document.createElement("div");
          pane.className = "partslinkFilePane";
          if (usableFiles.length > 1) {
            const caption = document.createElement("p");
            caption.className = "partslinkFileCaption";
            caption.textContent = fileName;
            pane.append(caption);
          }
          const previewSeparator = directUrl.includes("?") ? "&" : "?";
          const previewUrl = `${directUrl}${previewSeparator}preview=1`;
          if (previewUrl) {
            const frame = document.createElement("iframe");
            frame.className = "partslinkFileFrame";
            frame.src = previewUrl;
            frame.title = fileName;
            pane.append(frame);
          }
          fileViewer.append(pane);
        }

        downloadLinks.hidden = downloadLinks.children.length === 0;
      }

      function renderBrands() {
        brandSelect.innerHTML = "";
        brandPickerOptions.replaceChildren();
        const orderedBrands = brandDisplayOrder.filter((brand) => brandRoutes[brand]);
        const unlistedBrands = Object.keys(brandRoutes)
          .filter((brand) => !brandDisplayOrder.includes(brand))
          .sort((left, right) => left.localeCompare(right, "ru"));
        const options = [...orderedBrands, ...unlistedBrands].map((brand) => ({
          value: brand,
          label: brandLabels[brand] || brand,
          favorite: favoriteBrandValues.has(brand)
        }));

        options.forEach((brand) => {
          const option = document.createElement("option");
          option.value = brand.value;
          option.textContent = brand.label;
          if (brand.favorite) option.dataset.favorite = "true";
          brandSelect.append(option);

          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          pickerOption.dataset.value = brand.value;
          pickerOption.dataset.favorite = String(brand.favorite);
          pickerOption.dataset.search = [brand.label, brand.value]
            .map(normalizeBrandSearch)
            .filter((value, index, values) => value && values.indexOf(value) === index)
            .join("\n");
          pickerOption.textContent = brand.label;
          pickerOption.addEventListener("click", () => {
            brandSelect.value = brand.value;
            brandSelect.dispatchEvent(new Event("change"));
            closeBrandPicker();
          });
          brandPickerOptions.append(pickerOption);
          if (brandGroupDividerAfter.has(brand.value)) {
            pickerOption.classList.add("partslinkBrandOption--group-end");
          }
        });
        applyBrandLogic();
      }

      function renderLanguages() {
        languagePickerOptions.replaceChildren();
        [...languageSelect.options].forEach((language) => {
          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          pickerOption.dataset.value = language.value;
          pickerOption.dataset.favorite = "true";
          pickerOption.textContent = language.textContent;
          pickerOption.addEventListener("click", () => {
            languageSelect.value = language.value;
            languageSelect.dispatchEvent(new Event("change"));
            closeLanguagePicker();
          });
          languagePickerOptions.append(pickerOption);
        });
        applyLanguageLogic();
      }

      function applyLanguageLogic() {
        languagePickerLabel.textContent = languageSelect.selectedOptions[0]?.textContent || "";
        languagePickerButton.dataset.favorite = "true";
        languagePickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === languageSelect.value));
        });
      }

      function applyBrandLogic() {
        const selectedLabel = brandSelect.selectedOptions[0]?.textContent || "";
        const isFavorite = favoriteBrandValues.has(brandSelect.value);
        brandPickerLabel.textContent = selectedLabel;
        brandPickerButton.dataset.favorite = String(isFavorite);
        brandPickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === brandSelect.value));
        });
        const current = brandRoutes[brandSelect.value];
        if (!current) return;
        vinInput.placeholder = current.sampleVin || "";
        vinInput.dataset.route = current.route || "";
      }

      function closeBrandPicker() {
        brandPickerOptions.hidden = true;
        brandPickerButton.setAttribute("aria-expanded", "false");
        clearTimeout(brandTypeaheadTimer);
        brandTypeahead = "";
      }

      function toggleBrandPicker() {
        const isOpen = !brandPickerOptions.hidden;
        brandPickerOptions.hidden = isOpen;
        brandPickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          brandPickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      function selectBrandOption(option, { focus = true } = {}) {
        if (!option) return;
        brandSelect.value = option.dataset.value;
        brandSelect.dispatchEvent(new Event("change"));
        if (brandPickerOptions.hidden) toggleBrandPicker();
        if (focus) {
          option.focus();
          option.scrollIntoView({ block: "nearest" });
        }
      }

      function normalizeBrandSearch(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim()
          .toLocaleLowerCase();
      }

      function brandOptionMatches(option, query) {
        return String(option.dataset.search || "")
          .split("\n")
          .some((value) => value.startsWith(query));
      }

      function selectBrandFromTypeahead(event) {
        if (event.ctrlKey || event.metaKey || event.altKey || !/^[a-z]$/i.test(event.key)) return;

        clearTimeout(brandTypeaheadTimer);
        const typed = normalizeBrandSearch(event.key);
        const options = [...brandPickerOptions.querySelectorAll("[role='option']")];
        const currentIndex = options.findIndex((option) => option.dataset.value === brandSelect.value);
        brandTypeahead += typed;
        let matches = options.filter((option) => brandOptionMatches(option, brandTypeahead));

        if (!matches.length) {
          brandTypeahead = typed;
          matches = options.filter((option) => brandOptionMatches(option, typed));
          if (matches.length > 1) {
            const next = options.slice(currentIndex + 1).find((option) => matches.includes(option));
            if (next) matches = [next];
          }
        }

        event.preventDefault();
        brandTypeaheadTimer = setTimeout(() => {
          brandTypeahead = "";
        }, brandTypeaheadTimeout);

        const match = matches[0];
        if (!match) return;

        selectBrandOption(match);
      }

      function navigateBrandPicker(event) {
        const options = [...brandPickerOptions.querySelectorAll("[role='option']")];
        if (!options.length) return;
        const activeOption = document.activeElement.closest?.("[role='option']");
        const selectedIndex = options.findIndex((option) => option.dataset.value === brandSelect.value);
        const currentIndex = activeOption ? options.indexOf(activeOption) : selectedIndex;

        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (brandPickerOptions.hidden) toggleBrandPicker();
          const direction = event.key === "ArrowDown" ? 1 : -1;
          const nextIndex = (Math.max(currentIndex, 0) + direction + options.length) % options.length;
          options[nextIndex].focus();
          options[nextIndex].scrollIntoView({ block: "nearest" });
          return;
        }

        if (event.key === "Enter" && activeOption) {
          event.preventDefault();
          selectBrandOption(activeOption, { focus: false });
          closeBrandPicker();
          brandPickerButton.focus();
          return;
        }

        if (event.key === "Escape") {
          event.preventDefault();
          closeBrandPicker();
          brandPickerButton.focus();
          return;
        }

        selectBrandFromTypeahead(event);
      }

      function closeLanguagePicker() {
        languagePickerOptions.hidden = true;
        languagePickerButton.setAttribute("aria-expanded", "false");
      }

      function toggleLanguagePicker() {
        const isOpen = !languagePickerOptions.hidden;
        languagePickerOptions.hidden = isOpen;
        languagePickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          languagePickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      vinInput.addEventListener("input", () => {
        vinInput.value = vinInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 17);
        resetResults();
      });
      brandSelect.addEventListener("change", () => {
        vinInput.value = "";
        resetResults();
        applyBrandLogic();
      });
      brandPickerButton.addEventListener("click", toggleBrandPicker);
      brandPicker.addEventListener("keydown", (event) => {
        navigateBrandPicker(event);
      });
      languagePickerButton.addEventListener("click", toggleLanguagePicker);
      languagePickerButton.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (languagePickerOptions.hidden) toggleLanguagePicker();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".partslinkBrandPicker")) closeBrandPicker();
        if (!event.target.closest(".partslinkLanguagePicker")) closeLanguagePicker();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeBrandPicker();
          closeLanguagePicker();
        }
      });
      languageSelect.addEventListener("change", () => {
        resetResults();
        applyLanguageLogic();
      });
      uiLanguageButtons.forEach((button) => {
        button.addEventListener("click", () => applyUiLanguage(button.dataset.uiLanguage));
      });

      applyUiLanguage(readStoredUiLanguage(), { persist: false });
      renderLanguages();
      resetDownloadLink();

      fetch("./tools/partslink24/brand-routes.json?v=20260804-1")
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((data) => {
          brandRoutes = data.brands || fallbackBrands;
          renderBrands();
        })
        .catch(renderBrands);

      function readPayload() {
        const vin = vinInput.value.trim().toUpperCase();
        const brand = brandSelect.value;
        const language = languageSelect.value;

        if (!/^[A-Z0-9]{17}$/.test(vin)) {
          setStatusFromKey("invalidVin", "error");
          vinInput.focus();
          return null;
        }

        return { brand, vin, language };
      }

      checkButton.addEventListener("click", async () => {
        const payload = readPayload();
        if (!payload) return;

        setBusy(true);
        resetResults();
        setStatusFromKey("checking");
        try {
          const apiBase = getPartslinkApiBase();
          const response = await fetch(`${apiBase}/api/partslink24/check-vin`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json().catch(() => ({}));

          if (!response.ok || !result.ok) {
            throw new Error(result.error || uiText("backendUnavailable"));
          }

          const files = Array.isArray(result.files) && result.files.length
            ? result.files
            : [{ fileName: result.fileName, downloadUrl: result.downloadUrl }];
          setVehicleDescription(result.vehicleDescription || "");
          productionDateInput.dataset.rawValue = result.productionDate || "";
          engineTypeInput.dataset.rawValue = result.engineType || "";
          engineVolumeInput.dataset.rawValue = result.engineVolume || "";
          renderLocalizedResultValues();
          copyResultButton.disabled = !payload.vin || !productionDateInput.value;
          saveButton.disabled = !payload.vin || !vehicleDescriptionInput.value;
          await renderDownloadLinks(files, apiBase, payload.brand, payload.vin);
          setStatusFromKey(files.length > 1 ? "readyMany" : "readyOne", "success");
        } catch (error) {
          setStatus(formatVinCheckError(error), "error");
        } finally {
          setBusy(false);
        }
      });

    </script>
  </body>
