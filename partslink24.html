<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUTOGOOD VIN спецификация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./tokens.css?v=vincheck-20260724-1" />
    <link rel="stylesheet" href="./src/tools.css?v=vincheck-20260724-1" />
    <style>
      /* Hallmark · macrostructure: Workbench · tone: utilitarian · anchor hue: AUTOGOOD blue · nav: N9 · footer: Ft2 · contrast: pass (40–41) · mobile: pass (34, 49, 50–57) */
      html,
      body {
        overflow-x: clip;
      }

      body.partslinkPage {
        min-width: 320px;
        background: var(--ag-color-paper);
        color: var(--ag-color-ink);
        font-family: var(--ag-font-body);
        font-variant-numeric: tabular-nums;
      }

      .partslinkPage :focus {
        outline: none;
      }

      .partslinkPage :focus-visible {
        outline: 2px solid var(--ag-color-focus);
        outline-offset: 2px;
      }

      .partslinkShell {
        display: flex;
        flex-direction: column;
        width: min(1200px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: var(--ag-space-2xl) 0 var(--ag-space-page-bottom);
      }

      .partslinkTopbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-lg);
        padding-bottom: var(--ag-space-md);
        border-bottom: var(--ag-rule-card);
      }

      .partslinkWordmark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        color: var(--ag-color-ink);
        text-decoration: none;
      }

      .partslinkWordmark img {
        width: 164px;
        max-width: var(--ag-logo-max-width);
        height: auto;
        display: block;
      }

      .partslinkWordmarkDivider {
        flex: 0 0 auto;
        width: 1px;
        height: 26px;
        background: var(--ag-color-rule-2);
      }

      .partslinkWordmark span:not(.partslinkWordmarkDivider) {
        color: var(--ag-color-accent-dark);
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
        white-space: nowrap;
      }

      .partslinkNav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--ag-space-md);
        flex-wrap: wrap;
        min-width: 0;
      }

      .partslinkNav a {
        display: inline-flex;
        align-items: center;
        min-height: var(--ag-size-nav-link);
        border-bottom: 2px solid transparent;
        color: var(--ag-color-muted);
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
        transition: color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out);
      }

      .partslinkNav a:hover,
      .partslinkNav a:focus-visible,
      .partslinkNav a[aria-current="page"] {
        color: var(--ag-color-accent);
        border-bottom-color: var(--ag-color-accent);
      }

      .partslinkHero {
        display: grid;
        grid-template-columns: minmax(0, 0.86fr) minmax(var(--ag-hero-copy-min-width), 0.5fr);
        gap: var(--ag-space-xl);
        align-items: end;
        padding: var(--ag-space-2xl) 0 var(--ag-space-lg);
      }

      .partslinkEyebrow,
      .partslinkPanelTitle {
        margin: 0;
        color: var(--ag-color-muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .partslinkHero h1 {
        max-width: 22ch;
        min-width: 0;
        margin: var(--ag-space-xs) 0 0;
        color: var(--ag-color-ink);
        font-family: var(--ag-font-display);
        font-size: var(--ag-text-display);
        font-style: normal;
        font-weight: 800;
        letter-spacing: 0;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .partslinkWorkbench {
        display: grid;
        grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
        gap: var(--ag-space-lg);
        align-items: stretch;
      }

      .partslinkCard,
      .partslinkResultCard {
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkCard {
        display: grid;
        gap: var(--ag-space-sm);
      }

      .partslinkField {
        display: grid;
        gap: var(--ag-space-label-gap);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        font-weight: 600;
        line-height: 1.3;
      }

      .partslinkField span {
        display: block;
      }

      .partslinkField input,
      .partslinkField select {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 600;
        letter-spacing: 0;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out);
      }

      .partslinkField input:hover,
      .partslinkField select:hover {
        background: var(--ag-color-surface-tint);
      }

      .partslinkBrandNativeSelect {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .partslinkBrandPicker {
        position: relative;
      }

      .partslinkBrandPickerButton {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        color: var(--ag-color-ink);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
      }

      .partslinkBrandPickerButton:hover,
      .partslinkBrandPickerButton:focus-visible {
        border-color: var(--ag-color-accent);
        background: var(--ag-color-surface-tint);
      }

      .partslinkBrandPickerButton[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandCaret {
        flex: 0 0 auto;
        margin-left: var(--ag-space-sm);
        color: var(--ag-color-muted);
        font-size: 12px;
      }

      .partslinkBrandOptions {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        display: grid;
        max-height: 340px;
        overflow-y: auto;
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface);
        box-shadow: 0 12px 28px rgb(21 48 74 / 16%);
      }

      .partslinkBrandOptions[hidden] {
        display: none;
      }

      .partslinkBrandOption {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ag-color-rule);
        background: transparent;
        color: var(--ag-color-ink);
        padding: 10px var(--ag-space-field-x);
        font: inherit;
        font-size: var(--ag-text-base);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
      }

      .partslinkBrandOption:last-child {
        border-bottom: 0;
      }

      .partslinkBrandGroupDivider {
        height: 0;
        margin: 2px 0;
        border-top: 2px solid var(--ag-color-ink);
      }

      .partslinkBrandOption[data-favorite="true"] {
        font-weight: 700;
      }

      .partslinkBrandOption:hover,
      .partslinkBrandOption:focus-visible,
      .partslinkBrandOption[aria-selected="true"] {
        background: var(--ag-color-surface-tint);
        color: var(--ag-color-accent-dark);
      }

      .partslinkField input:focus-visible,
      .partslinkField select:focus-visible {
        border-color: var(--ag-color-accent);
      }

      .partslinkHint {
        min-height: 1lh;
        color: var(--ag-color-muted);
        font-size: var(--ag-text-xs);
        font-weight: 400;
        line-height: 1.35;
      }

      .partslinkActions {
        display: flex;
        align-items: center;
        gap: var(--ag-space-xs);
        flex-wrap: wrap;
        padding-top: var(--ag-space-xs);
      }

      .partslinkActions button,
      .partslinkDownloadLink {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--ag-size-download-action);
        border: 1px solid var(--ag-color-accent);
        border-radius: var(--ag-radius-control);
        background: var(--ag-color-accent);
        color: var(--ag-color-accent-ink);
        padding: var(--ag-space-control-y) var(--ag-space-button-x);
        font: inherit;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color var(--ag-dur-short) var(--ag-ease-out), border-color var(--ag-dur-short) var(--ag-ease-out), transform 100ms var(--ag-ease-out);
      }

      .partslinkActions button:hover,
      .partslinkDownloadLink:hover {
        transform: translateY(-1px);
      }

      .partslinkActions button:active,
      .partslinkDownloadLink:active {
        transform: translateY(1px);
      }

      .partslinkActions button:disabled {
        border-color: var(--ag-color-rule-2);
        background: var(--ag-color-rule);
        color: var(--ag-color-muted);
        cursor: wait;
        transform: none;
      }

      .partslinkDownloadLink[hidden] {
        display: none;
      }

      .partslinkDownloadLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .partslinkResultCard {
        display: grid;
        align-content: start;
        gap: var(--ag-space-md);
      }

      .partslinkSpecRows {
        display: grid;
        gap: 0;
      }

      .partslinkSpecRow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(var(--ag-result-min-width), 0.72fr);
        gap: var(--ag-space-md);
        align-items: center;
        min-height: calc(var(--ag-size-action) + var(--ag-space-sm));
        border-bottom: 2px solid var(--ag-color-rule);
        padding: var(--ag-space-sm) 0;
      }

      .partslinkSpecRow:first-child {
        border-bottom-color: var(--ag-color-soft);
      }

      .partslinkSpecRow:last-child {
        border-bottom: 0;
      }

      .partslinkSpecRow span {
        color: var(--ag-color-ink);
        font-size: var(--ag-text-base);
        font-weight: 600;
      }

      .partslinkSpecRow strong,
      .partslinkReadonlyField {
        color: var(--ag-color-accent-dark);
        font-size: var(--ag-text-md);
        font-weight: 800;
        line-height: 1.2;
      }

      .partslinkReadonlyField {
        width: 100%;
        min-height: var(--ag-size-action);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        padding: var(--ag-space-control-y) var(--ag-space-field-x);
        font-family: var(--ag-font-body);
      }

      .partslinkReadonlyField::placeholder {
        color: var(--ag-color-muted);
      }

      .partslinkFileBlock {
        display: grid;
        gap: var(--ag-space-md);
        margin-top: var(--ag-space-lg);
        border: var(--ag-rule-card);
        border-radius: var(--ag-radius-card);
        background: var(--ag-color-surface);
        padding: var(--ag-space-xl);
      }

      .partslinkFileHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ag-space-md);
        flex-wrap: wrap;
      }

      .partslinkFileViewer {
        display: grid;
        gap: var(--ag-space-md);
        border: var(--ag-rule-field);
        border-radius: var(--ag-radius-input);
        background: var(--ag-color-surface-tint);
        overflow: hidden;
      }

      .partslinkFileViewer[data-empty="true"] {
        place-items: center;
        min-height: 220px;
      }

      .partslinkFileEmpty {
        margin: 0;
        padding: var(--ag-space-lg);
        color: var(--ag-color-muted);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
        text-align: center;
      }

      .partslinkFilePane {
        display: grid;
        gap: 0;
        min-width: 0;
      }

      .partslinkFileCaption {
        margin: 0;
        border-bottom: var(--ag-rule-field);
        background: var(--ag-color-surface);
        padding: var(--ag-space-sm) var(--ag-space-field-x);
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-xs);
        font-weight: 700;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .partslinkFileFrame {
        display: block;
        width: 100%;
        height: min(78vh, 900px);
        min-height: 520px;
        border: 0;
        background: var(--ag-color-surface);
      }

      .partslinkStatus {
        min-height: 20px;
        margin: 0;
        color: var(--ag-color-ink-2);
        font-size: var(--ag-text-sm);
        line-height: 1.4;
      }

      .partslinkStatus[data-tone="success"] {
        color: var(--ag-color-success);
        font-weight: 700;
      }

      .partslinkStatus[data-tone="error"] {
        color: var(--ag-color-error);
        font-weight: 700;
      }

      @media (max-width: 780px) {
        .partslinkShell {
          width: min(100% - 32px, 1200px);
          padding-top: var(--ag-space-xl);
        }

        .partslinkTopbar,
        .partslinkHero,
        .partslinkWorkbench {
          grid-template-columns: 1fr;
        }

        .partslinkTopbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .partslinkNav {
          justify-content: flex-start;
        }

        .partslinkHero {
          gap: var(--ag-space-md);
        }

        .partslinkCard,
        .partslinkResultCard,
        .partslinkFileBlock {
          padding: var(--ag-space-lg);
        }

        .partslinkFileFrame {
          height: min(70vh, 720px);
          min-height: 420px;
        }
      }

      @media (max-width: 420px) {
        .partslinkShell {
          width: min(100% - 24px, 1200px);
        }

        .partslinkWordmark {
          align-items: flex-start;
          flex-direction: column;
        }

        .partslinkActions {
          align-items: stretch;
          flex-direction: column;
        }

        .partslinkActions button,
        .partslinkDownloadLink {
          width: 100%;
          min-height: var(--ag-size-action);
        }

        .partslinkSpecRow {
          grid-template-columns: 1fr;
          gap: var(--ag-space-xs);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 150ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 150ms !important;
        }
      }
    </style>
  </head>
  <body class="partslinkPage">
    <main class="partslinkShell">
      <header class="partslinkTopbar">
        <a class="partslinkWordmark" href="./" aria-label="AUTOGOOD Tools">
          <img src="./assets/autogood-logo.png" alt="AUTOGOOD" />
          <span class="partslinkWordmarkDivider" aria-hidden="true"></span>
          <span>VIN Check</span>
        </a>
        <nav class="partslinkNav" aria-label="Workspace navigation">
          <a href="./">Tools</a>
          <a href="./calculators.html">Kalkulatory</a>
          <a href="./umowy.html">Umowy PDF</a>
          <a href="./auctions.html">Aukcje</a>
        </nav>
      </header>

      <section class="partslinkHero">
        <div>
          <p class="partslinkEyebrow">Проверка VIN</p>
        </div>
      </section>

      <section class="partslinkWorkbench" aria-label="VIN PDF and production date form">
        <div class="partslinkCard">
          <p class="partslinkPanelTitle">Данные проверки</p>
          <label class="partslinkField">
            <span>1. Язык</span>
            <div class="partslinkBrandPicker partslinkLanguagePicker">
              <button id="partslinkLanguageButton" class="partslinkBrandPickerButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="partslinkLanguageOptions">
                <span id="partslinkLanguageLabel"></span>
                <span class="partslinkBrandCaret" aria-hidden="true">&#9662;</span>
              </button>
              <div id="partslinkLanguageOptions" class="partslinkBrandOptions" role="listbox" hidden></div>
              <select id="partslinkLanguage" class="partslinkBrandNativeSelect" name="language" tabindex="-1" aria-hidden="true">
                <option value="RU">RU</option>
                <option value="PL">PL</option>
                <option value="ENG">ENG</option>
              </select>
            </div>
          </label>

          <label class="partslinkField">
            <span>2. Марка авто</span>
            <div class="partslinkBrandPicker">
              <button id="partslinkBrandButton" class="partslinkBrandPickerButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="partslinkBrandOptions">
                <span id="partslinkBrandLabel"></span>
                <span class="partslinkBrandCaret" aria-hidden="true">&#9662;</span>
              </button>
              <div id="partslinkBrandOptions" class="partslinkBrandOptions" role="listbox" hidden></div>
              <select id="partslinkBrand" class="partslinkBrandNativeSelect" name="brand" tabindex="-1" aria-hidden="true"></select>
            </div>
          </label>

          <label class="partslinkField">
            <span>3. VIN</span>
            <input id="partslinkVin" name="vin" type="text" autocomplete="off" maxlength="17" />
            <small class="partslinkHint">17 символов.</small>
          </label>

          <div class="partslinkActions">
            <button id="partslinkCheckButton" type="button">Проверить данные</button>
          </div>
          <p id="partslinkStatus" class="partslinkStatus" role="status" aria-live="polite"></p>
        </div>

        <aside class="partslinkResultCard" aria-label="VIN check result">
          <p class="partslinkPanelTitle">Результат</p>
          <div class="partslinkSpecRows">
            <label class="partslinkSpecRow" for="partslinkVehicleDescription">
              <span>Марка и модель авто</span>
              <input id="partslinkVehicleDescription" class="partslinkReadonlyField" name="vehicleDescription" type="text" readonly placeholder="—" />
            </label>
            <label class="partslinkSpecRow" for="partslinkProductionDate">
              <span>Дата производства</span>
              <input id="partslinkProductionDate" class="partslinkReadonlyField" name="productionDate" type="text" readonly placeholder="—" />
            </label>
            <label class="partslinkSpecRow" for="partslinkEngineType">
              <span>Тип двигателя</span>
              <input id="partslinkEngineType" class="partslinkReadonlyField" name="engineType" type="text" readonly placeholder="—" />
            </label>
            <label class="partslinkSpecRow" for="partslinkEngineVolume">
              <span>Объем двигателя</span>
              <input id="partslinkEngineVolume" class="partslinkReadonlyField" name="engineVolume" type="text" readonly placeholder="—" />
            </label>
          </div>
        </aside>
      </section>

      <section class="partslinkFileBlock" aria-label="Файл VIN">
        <div class="partslinkFileHead">
          <p class="partslinkPanelTitle">Файл VIN</p>
          <div id="partslinkDownloadLinks" class="partslinkDownloadLinks" hidden></div>
        </div>
        <div id="partslinkFileViewer" class="partslinkFileViewer" data-empty="true"></div>
      </section>

    </main>
    <script>
      const languageSelect = document.getElementById("partslinkLanguage");
      const languagePickerButton = document.getElementById("partslinkLanguageButton");
      const languagePickerLabel = document.getElementById("partslinkLanguageLabel");

      let previewObjectUrls = [];

        Cupra: { route: "general_vin_search" },
        Dacia: { route: "general_vin_search" },
        DS: { route: "brand_first_search" },

        MAN: { route: "pending_demo" },
        "Mercedes-Benz": { sampleVin: "WDD2120481A322032", route: "brand_first_search" },
        "Mercedes Classic": { route: "pending_demo" },
        "Mercedes Trucks": { route: "brand_first_search" },
        "Mercedes Unimog": { route: "pending_demo" },
        "Mercedes Vans": { route: "brand_first_search" },
        Mini: { route: "general_vin_search" },
        "Mini Classic": { route: "pending_demo" },
        Mitsubishi: { route: "general_vin_search" },
        Nissan: { route: "two_file_print" },
        Opel: { route: "brand_first_search" },
        "Opel Legacy": { route: "pending_demo" },
        Peugeot: { sampleVin: "VR3FPHNSTPY610770", route: "brand_first_search" },
        Polestar: { route: "pending_demo" },
        Porsche: { route: "general_vin_search" },
        "Porsche Classic": { route: "pending_demo" },
        Renault: { route: "brand_first_search" },
        Seat: { route: "brand_first_search" },
        Skoda: { route: "brand_first_search" },
        Smart: { route: "general_vin_search" },
        Suzuki: { route: "general_vin_search" },
        Toyota: { route: "general_vin_search" },
        Vauxhall: { route: "pending_demo" },
        "Vauxhall Legacy": { route: "pending_demo" },
        Volkswagen: { route: "brand_first_search" },
        "Volkswagen Classic Parts": { route: "pending_demo" },
        Volvo: { sampleVin: "YV1ZZK5V2P2106956", route: "general_vin_search" },
        "Vw Nutzfahrzeuge": { route: "brand_first_search" }
      };
      let brandRoutes = fallbackBrands;
      const favoriteBrands = [
        { value: "Audi", label: "Audi" },
        { value: "BMW", label: "BMW" },
        { value: "Ford", label: "Ford" },
        { value: "Mercedes-Benz", label: "Mercedes-Benz" },
        { value: "Peugeot", label: "Peugeot" },
        { value: "Renault", label: "Renault" },
        { value: "Toyota", label: "Toyota" },
        { value: "Volvo", label: "Volvo" },
        { value: "Volkswagen", label: "Volkswagen" }
      ];
      const favoriteBrandValues = new Set(favoriteBrands.map((brand) => brand.value));
      const brandLabels = {
        "Vw Nutzfahrzeuge": "Volkswagen Nutzfahrzeuge"
      };
      const brandDisplayOrder = [
        "Audi", "BMW", "Ford", "Mercedes-Benz", "Peugeot", "Renault", "Toyota", "Volvo", "Volkswagen",
        "Alfa Romeo", "Citroen", "Cupra", "DS", "Fiat", "Ford Pro", "Hyundai", "Jaguar", "Jeep", "Kia", "Land Rover", "Lexus", "Mini", "Mitsubishi", "Nissan", "Opel", "Porsche", "Porsche Classic", "Seat", "Skoda", "Suzuki", "Vw Nutzfahrzeuge",
        "Abarth", "Alpine", "Bentley", "BMW Classic", "BMW Motorrad", "BMW Motorrad Classic", "Dacia", "Fiat Professional", "Infiniti", "Iveco", "Lancia", "MAN", "Mercedes Classic", "Mercedes Trucks", "Mercedes Unimog", "Mercedes Vans", "Mini Classic", "Opel Legacy", "Polestar", "Smart", "Vauxhall", "Vauxhall Legacy", "Volkswagen Classic Parts"
      ];
      const brandGroupDividerAfter = new Set(["Volkswagen", "Vw Nutzfahrzeuge"]);
      const defaultPartslinkApiBase = "https://dare-lid-bind-advantage.trycloudflare.com";
      let brandTypeahead = "";
      let brandTypeaheadTimer;

      function readApiBaseFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const value = params.get("api") || params.get("backend");
        if (!value) return "";
        const normalized = value.trim().replace(/\/$/, "");
        if (/^https:\/\/[a-z0-9.-]+/i.test(normalized)) {
          return normalized;
        }
        return "";
      }

      function getPartslinkApiBase() {
        const urlApiBase = readApiBaseFromUrl();
        if (urlApiBase) return urlApiBase;
        if (window.PARTSLINK24_API_BASE) {
          return String(window.PARTSLINK24_API_BASE).replace(/\/$/, "");
        }
        if (["127.0.0.1", "localhost"].includes(window.location.hostname)) {
          return "";
        }
        if (!window.location.hostname.endsWith(".github.io")) {
          return "";
        }
        return defaultPartslinkApiBase;
      }

      function makePdfFileName(brand, vin, language) {
        return `${brand}_${vin}_${language}.pdf`.replace(/[^A-Za-z0-9_.-]/g, "_");
      }

      function releasePreviewUrls() {
        previewObjectUrls.forEach((url) => URL.revokeObjectURL(url));
        previewObjectUrls = [];
      }

      function makeFileMessage(text) {
        const message = document.createElement("p");
        message.className = "partslinkFileEmpty";
        message.textContent = text;
        return message;
      }

      function resetDownloadLink() {
        releasePreviewUrls();
        downloadLinks.hidden = true;
        downloadLinks.replaceChildren();
        fileViewer.dataset.empty = "true";
        fileViewer.replaceChildren(makeFileMessage(emptyFileMessage));
      }

      function resetProductionDate() {
        productionDateInput.value = "";
        engineTypeInput.value = "";
        engineVolumeInput.value = "";
      }

      function setVehicleDescription(value) {
        vehicleDescriptionInput.value = value || "";
      }

      function resetResults() {
        resetDownloadLink();
        resetProductionDate();
        setVehicleDescription("");
        statusLine.textContent = "";
        statusLine.removeAttribute("data-tone");
      }

      function setStatus(message, tone = "") {
        statusLine.textContent = message;
        if (tone) {
          statusLine.dataset.tone = tone;
        } else {
          statusLine.removeAttribute("data-tone");
        }
      }

      function setBusy(isBusy) {
        checkButton.disabled = isBusy;
      }

      async function renderDownloadLinks(files, apiBase, brand, vin, language) {
        releasePreviewUrls();
        downloadLinks.replaceChildren();
        fileViewer.replaceChildren();

        const usableFiles = files.filter((file) => file.downloadUrl);
        if (!usableFiles.length) {
          downloadLinks.hidden = true;
          fileViewer.dataset.empty = "true";
          fileViewer.append(makeFileMessage("Сервер не вернул файл."));
          return;
        }

        fileViewer.dataset.empty = "false";

        for (const [index, file] of usableFiles.entries()) {
          const fileName = makePdfFileName(brand, vin, language);
          const separator = file.downloadUrl.includes("?") ? "&" : "?";
          const directUrl = `${apiBase}${file.downloadUrl}${separator}downloadName=${encodeURIComponent(fileName)}`;
          // The PDF route sends content-disposition: attachment, so an iframe
          // pointed at it downloads instead of previewing. Fetch it as a blob
          // and preview the object URL; fall back to the direct link if that fails.
          let previewUrl = "";
          try {
            const response = await fetch(directUrl);
            if (!response.ok) throw new Error("preview unavailable");
            previewUrl = URL.createObjectURL(await response.blob());
            previewObjectUrls.push(previewUrl);
          } catch {
            previewUrl = "";
          }

          const link = document.createElement("a");
          link.className = "partslinkDownloadLink";
          link.href = previewUrl || directUrl;
          link.download = fileName;
          link.textContent = usableFiles.length > 1 ? `Выгрузить файл ${index + 1}` : "Выгрузить файл";
          downloadLinks.append(link);

          const pane = document.createElement("div");
          pane.className = "partslinkFilePane";
          if (usableFiles.length > 1) {
            const caption = document.createElement("p");
            caption.className = "partslinkFileCaption";
            caption.textContent = fileName;
            pane.append(caption);
          }
          if (previewUrl) {
            const frame = document.createElement("iframe");
            frame.className = "partslinkFileFrame";
            frame.src = previewUrl;
            frame.title = fileName;
            pane.append(frame);
          } else {
            pane.append(makeFileMessage(`Предпросмотр недоступен. Скачайте файл ${fileName} кнопкой выше.`));
          }
          fileViewer.append(pane);
        }

        downloadLinks.hidden = downloadLinks.children.length === 0;
      }

      function renderBrands() {
        brandSelect.innerHTML = "";
        brandPickerOptions.replaceChildren();
        const orderedBrands = brandDisplayOrder.filter((brand) => brandRoutes[brand]);
        const unlistedBrands = Object.keys(brandRoutes)
          .filter((brand) => !brandDisplayOrder.includes(brand))
          .sort((left, right) => left.localeCompare(right, "ru"));
        const options = [...orderedBrands, ...unlistedBrands].map((brand) => ({
          value: brand,
          label: brandLabels[brand] || brand,
          favorite: favoriteBrandValues.has(brand)
        }));

        options.forEach((brand) => {
          const option = document.createElement("option");
          option.value = brand.value;
          option.textContent = brand.label;
          if (brand.favorite) option.dataset.favorite = "true";
          brandSelect.append(option);

          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          pickerOption.dataset.value = brand.value;
          pickerOption.dataset.favorite = String(brand.favorite);
          pickerOption.textContent = brand.label;
          pickerOption.addEventListener("click", () => {
            brandSelect.value = brand.value;
            brandSelect.dispatchEvent(new Event("change"));
            closeBrandPicker();
          });
          brandPickerOptions.append(pickerOption);
          if (brandGroupDividerAfter.has(brand.value)) {
            const divider = document.createElement("div");
            divider.className = "partslinkBrandGroupDivider";
            divider.setAttribute("role", "separator");
            brandPickerOptions.append(divider);
          }
        });
        applyBrandLogic();
      }

      function renderLanguages() {
        languagePickerOptions.replaceChildren();
        [...languageSelect.options].forEach((language) => {
          const pickerOption = document.createElement("button");
          pickerOption.type = "button";
          pickerOption.className = "partslinkBrandOption";
          pickerOption.role = "option";
          pickerOption.dataset.value = language.value;
          pickerOption.dataset.favorite = "true";
          pickerOption.textContent = language.textContent;
          pickerOption.addEventListener("click", () => {
            languageSelect.value = language.value;
            languageSelect.dispatchEvent(new Event("change"));
            closeLanguagePicker();
          });
          languagePickerOptions.append(pickerOption);
        });
        applyLanguageLogic();
      }

      function applyLanguageLogic() {
        languagePickerLabel.textContent = languageSelect.selectedOptions[0]?.textContent || "";
        languagePickerButton.dataset.favorite = "true";
        languagePickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === languageSelect.value));
        });
      }

      function applyBrandLogic() {
        const selectedLabel = brandSelect.selectedOptions[0]?.textContent || "";
        const isFavorite = favoriteBrandValues.has(brandSelect.value);
        brandPickerLabel.textContent = selectedLabel;
        brandPickerButton.dataset.favorite = String(isFavorite);
        brandPickerOptions.querySelectorAll("[role='option']").forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.value === brandSelect.value));
        });
        const current = brandRoutes[brandSelect.value];
        if (!current) return;
        vinInput.placeholder = current.sampleVin || "";
        vinInput.dataset.route = current.route || "";
      }

      function closeBrandPicker() {
        brandPickerOptions.hidden = true;
        brandPickerButton.setAttribute("aria-expanded", "false");
      }

      function toggleBrandPicker() {
        const isOpen = !brandPickerOptions.hidden;
        brandPickerOptions.hidden = isOpen;
        brandPickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          brandPickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      function selectBrandFromTypeahead(event) {
        if (event.ctrlKey || event.metaKey || event.altKey || event.key.length !== 1 || !event.key.trim()) return;

        const typed = event.key.toLocaleLowerCase();
        const options = [...brandPickerOptions.querySelectorAll("[role='option']")];
        const currentIndex = options.findIndex((option) => option.dataset.value === brandSelect.value);
        brandTypeahead += typed;
        let matches = options.filter((option) => option.textContent.trim().toLocaleLowerCase().startsWith(brandTypeahead));

        if (!matches.length) {
          brandTypeahead = typed;
          matches = options.filter((option) => option.textContent.trim().toLocaleLowerCase().startsWith(typed));
          if (matches.length > 1) {
            const next = options.slice(currentIndex + 1).find((option) => matches.includes(option));
            if (next) matches = [next];
          }
        }

        const match = matches[0];
        if (!match) return;

        event.preventDefault();
        if (brandPickerOptions.hidden) toggleBrandPicker();
        brandSelect.value = match.dataset.value;
        brandSelect.dispatchEvent(new Event("change"));
        match.focus();
        match.scrollIntoView({ block: "nearest" });
        clearTimeout(brandTypeaheadTimer);
        brandTypeaheadTimer = setTimeout(() => {
          brandTypeahead = "";
        }, 700);
      }

      function closeLanguagePicker() {
        languagePickerOptions.hidden = true;
        languagePickerButton.setAttribute("aria-expanded", "false");
      }

      function toggleLanguagePicker() {
        const isOpen = !languagePickerOptions.hidden;
        languagePickerOptions.hidden = isOpen;
        languagePickerButton.setAttribute("aria-expanded", String(!isOpen));
        if (!isOpen) {
          languagePickerOptions.querySelector('[aria-selected="true"]')?.focus();
        }
      }

      vinInput.addEventListener("input", () => {
        vinInput.value = vinInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 17);
        resetResults();
      });
      brandSelect.addEventListener("change", () => {
        vinInput.value = "";
        resetResults();
        applyBrandLogic();
      });
      brandPickerButton.addEventListener("click", toggleBrandPicker);
      brandPickerButton.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (brandPickerOptions.hidden) toggleBrandPicker();
          return;
        }
        selectBrandFromTypeahead(event);
      });
      brandPickerOptions.addEventListener("keydown", selectBrandFromTypeahead);
      languagePickerButton.addEventListener("click", toggleLanguagePicker);
      languagePickerButton.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (languagePickerOptions.hidden) toggleLanguagePicker();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".partslinkBrandPicker")) closeBrandPicker();
        if (!event.target.closest(".partslinkLanguagePicker")) closeLanguagePicker();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeBrandPicker();
          closeLanguagePicker();
        }
      });
      languageSelect.addEventListener("change", () => {
        resetResults();
        applyLanguageLogic();
      });

      renderLanguages();
      resetDownloadLink();

      fetch("./tools/partslink24/brand-routes.json?v=20260804-1")
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((data) => {
          brandRoutes = data.brands || fallbackBrands;
          renderBrands();
        })
        .catch(renderBrands);

      function readPayload() {
        const vin = vinInput.value.trim().toUpperCase();
        const brand = brandSelect.value;
        const language = languageSelect.value;

        if (!/^[A-Z0-9]{17}$/.test(vin)) {
          setStatus("VIN должен содержать 17 символов: проверьте ввод и повторите.", "error");
          vinInput.focus();
          return null;
        }

        return { brand, vin, language };
      }

      checkButton.addEventListener("click", async () => {
        const payload = readPayload();
        if (!payload) return;

        setBusy(true);
        resetResults();
        setStatus("Проверяем данные и готовим файл VIN...");
        try {
          const apiBase = getPartslinkApiBase();
          const response = await fetch(`${apiBase}/api/partslink24/check-vin`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload)
          });
          const result = await response.json().catch(() => ({}));

          if (!response.ok || !result.ok) {
            throw new Error(result.error || "Сервер проверки VIN недоступен.");
          }

          const files = Array.isArray(result.files) && result.files.length
            ? result.files
            : [{ fileName: result.fileName, downloadUrl: result.downloadUrl }];
          setVehicleDescription(result.vehicleDescription || "");
          productionDateInput.value = result.productionDate || "";
          engineTypeInput.value = result.engineType || "";
          engineVolumeInput.value = result.engineVolume || "";
          await renderDownloadLinks(files, apiBase, payload.brand, payload.vin, payload.language);
          setStatus(files.length > 1 ? "Данные получены, файлы готовы в блоке «Файл VIN»." : "Данные получены, файл готов в блоке «Файл VIN».", "success");
        } catch (error) {
          setStatus(error.message || "GitHub-странице нужен HTTPS backend. Открой ссылку с параметром ?api=адрес_backend или локальную страницу.", "error");
        } finally {
          setBusy(false);
        }
      });

    </script>
