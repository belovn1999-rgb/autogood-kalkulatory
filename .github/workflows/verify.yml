name: Verify AUTOGOOD VIN package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run verify
